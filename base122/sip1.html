    // Helper: ArrayBuffer -> Base64 (en chunks para no reventar memoria)
    function arrayBufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      const chunk = 0x8000; // ~32KB
      let binary = "";
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    // Descargar un base64 como archivo
    function downloadBase64(b64, filename = "dump.bin", mime = "application/octet-stream") {
      const a = document.createElement("a");
      a.href = `data:${mime};base64,${b64}`;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    // Uso con tu promesa:

    decompressArrayBuffer(test, true)
      .then((buf) => {
        const b64 = arrayBufferToBase64(buf);
        // Opcional: log de muestra
        console.log("b64:", b64.slice(0, 80) + "...");
        downloadBase64(b64, "archivo.bin", "application/octet-stream");
      });
